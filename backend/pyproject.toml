[project]
name = "mread-backend"
version = "0.1.0"
description = "MRead: a visual-culture multi-agent reading desk"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "pypdf>=4.2",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
